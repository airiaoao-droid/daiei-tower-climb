name = "daiei-tower-climb"
main = "worker/index.ts"
compatibility_date = "2026-04-01"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[durable_objects]
bindings = [
  { name = "RANKING_STORE", class_name = "RankingStore" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RankingStore"]
